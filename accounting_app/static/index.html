<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简账 · 个人记账与预算分析</title><link rel="stylesheet" href="/static/style.css"><body><header><b>简账</b><span>个人记账与预算分析系统</span><small>本地运行 · 数据由你掌握</small></header><main><div class="heading"><div><p class="eyebrow">MONTHLY OVERVIEW</p><h1>让每一笔收支都有记录</h1><p>记录日常开销，了解消费结构，合理安排月度预算。</p></div><label>查看月份 <input id="month" type="month" required></label></div><section class="metrics"><article>本月收入<strong id="income"></strong></article><article>本月支出<strong id="expense"></strong></article><article>本月结余<strong id="balance"></strong></article><article>预算剩余<strong id="remaining"></strong></article></section><div class="columns"><section class="panel"><h2>记一笔</h2><form id="record"><div class="pair"><label>日期<input name="day" type="date" required></label><label>收支类型<select name="kind"><option>支出</option><option>收入</option></select></label></div><div class="pair"><label>消费分类<select name="category"><option>餐饮</option><option>交通</option><option>购物</option><option>学习</option><option>娱乐</option><option>其他</option><option>工资</option><option>生活费</option></select></label><label>金额（元）<input name="amount" type="number" min="0.01" max="100000000" step="0.01" placeholder="0.00" required></label></div><label>备注<input name="note" maxlength="200" placeholder="例如：午餐、购买教材"></label><button>保存记录</button></form><h2 class="space">月度预算</h2><form id="budget"><label>支出上限（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><button class="secondary">更新预算</button></form></section><section class="panel"><h2>消费结构与预算提醒</h2><div id="budgetText"></div><progress id="progress" max="100" value="0"></progress><div id="tips"></div><h3>支出分类占比</h3><div id="bars"></div><p class="muted">提醒按固定规则生成，无需联网或 API 密钥。</p></section></div><section class="panel records"><div class="row"><h2>本月收支明细</h2><a id="export">导出 CSV</a></div><div class="scroll"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="message" role="status"></p><footer>简账 · Python + SQLite · 本地单用户应用</footer></main><script src="/static/app.js"></script></body></html>
